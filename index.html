<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<!-- displays site properly based on user's device -->

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
		rel="stylesheet">
	<link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
	<link rel="stylesheet" href="./css/styles.css">

	<title>Frontend Mentor | Social links profile</title>

	<!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
	<style>
		.attribution {
			font-size: 0.6875rem;
			text-align: center;
		}

		.attribution a {
			color: hsl(228, 45%, 44%);
		}
	</style>
</head>

<body>
	<main>
		<article class="card">
			<section class="avatar">
				<img src="./assets/images/avatar-jessica.jpeg" alt="Profile picture of Jessica Randall">
			</section>
			<section class="profile">
				<h1 class="name">Jessica Randall</h1>
				<p class="location">London, United Kingdom</p>
			</section>
			<p class="bio">Front-end developer and avid reader.</p>
			<section class="social-links">
				<a class="social-button" role="button" href="">GitHub</a>
				<a class="social-button" role="button" href="">Frontend Mentor</a>
				<a class="social-button" role="button" href="">LinkedIn</a>
				<a class="social-button" role="button" href="">Twitter</a>
				<a class="social-button" role="button" href="">Instagram</a>
			</section>
		</article>
	</main>


	<footer class="attribution">
		<p>Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.</p>
		<p>Coded by <a href="https://www.frontendmentor.io/profile/kkanit22">Karl Kanitsch</a>.</p>
	</footer>
</body>

</html>
